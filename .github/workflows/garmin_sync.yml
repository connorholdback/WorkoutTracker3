name: Garmin Connect to IronPulse Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of past days to fetch from Garmin Connect'
        required: false
        default: '30'
      start_date:
        description: 'Optional explicit Start Date (YYYY-MM-DD)'
        required: false
        default: ''
      end_date:
        description: 'Optional explicit End Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  sync-garmin-data:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Garmin Connect Library
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect

      - name: Run Garmin Sync Script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          SYNC_DAYS_BACK: ${{ github.event.inputs.days_back || '30' }}
          SYNC_START_DATE: ${{ github.event.inputs.start_date || '' }}
          SYNC_END_DATE: ${{ github.event.inputs.end_date || '' }}
        run: python -u sync_garmin.py
